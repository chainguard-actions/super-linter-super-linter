---
name: Test super-linter JSON validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        env:
          RUN_LOCAL: "true"
          VALIDATE_JSON: "true"
          VALIDATE_ALL_CODEBASE: "true"
          DEFAULT_BRANCH: act-harness
          GITHUB_TOKEN: ${{ github.token }}
          FILTER_REGEX_INCLUDE: ".*tests/fixtures/json/.*"

      - name: Assert linter ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: super-linter ran successfully and found no JSON issues"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: super-linter ran (may have found issues, acceptable under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
