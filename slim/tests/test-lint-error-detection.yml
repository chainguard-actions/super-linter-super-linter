---
name: Test super-linter detects lint errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        name: Run super-linter expecting lint failure on invalid JSON
        uses: .
        continue-on-error: true
        env:
          RUN_LOCAL: "true"
          VALIDATE_JSON: "true"
          VALIDATE_ALL_CODEBASE: "true"
          LOG_LEVEL: WARN
          FILTER_REGEX_INCLUDE: ".*tests/fixtures/json-bad/.*"

      - name: Assert linter detected errors (step should fail)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: super-linter correctly reported lint errors"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: super-linter ran (may have skipped invalid file or passed)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
