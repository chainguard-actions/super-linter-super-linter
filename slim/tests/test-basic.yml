---
name: Test super-linter basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_LOCAL: "true"
          DEFAULT_WORKSPACE: ${{ github.workspace }}/tests/fixtures/lint-target
          VALIDATE_ALL_CODEBASE: "true"
          VALIDATE_MARKDOWN: "true"
          LOG_LEVEL: WARN

      - name: Assert super-linter ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: super-linter completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: super-linter ran and reported linting issues (acceptable outcome)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
