---
name: Test super-linter basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a simple markdown file to lint
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-lint-target"
          cat > "$GITHUB_WORKSPACE/test-lint-target/README.md" << 'EOF'
          # Test README

          This is a simple markdown file for testing super-linter.

          ## Section

          Some content here.
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_LOCAL: "true"
          VALIDATE_ALL_CODEBASE: "true"
          VALIDATE_MARKDOWN: "true"
          VALIDATE_BASH: "false"
          VALIDATE_YAML: "false"
          VALIDATE_JSON: "false"
          VALIDATE_PYTHON_PYLINT: "false"
          VALIDATE_PYTHON_FLAKE8: "false"
          VALIDATE_PYTHON_BLACK: "false"
          VALIDATE_PYTHON_ISORT: "false"
          VALIDATE_PYTHON_MYPY: "false"
          VALIDATE_PYTHON_PYINK: "false"
          VALIDATE_PYTHON_RUFF: "false"
          VALIDATE_GITHUB_ACTIONS: "false"
          VALIDATE_DOCKERFILE_HADOLINT: "false"
          VALIDATE_SHELL_SHFMT: "false"
          VALIDATE_EDITORCONFIG: "false"
          VALIDATE_GITLEAKS: "false"
          VALIDATE_CHECKOV: "false"
          VALIDATE_NATURAL_LANGUAGE: "false"
          VALIDATE_RENOVATE: "false"
          VALIDATE_JSCPD: "false"
          LOG_LEVEL: "NOTICE"

      - name: Assert super-linter ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: super-linter completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: super-linter ran and reported linting issues (expected in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
