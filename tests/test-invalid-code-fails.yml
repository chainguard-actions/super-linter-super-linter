---
name: Test super-linter fails on invalid code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run super-linter expecting failure on invalid JSON
        id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_LOCAL: "true"
          DEFAULT_WORKSPACE: /github/workspace
          VALIDATE_ALL_CODEBASE: "true"
          USE_FIND_ALGORITHM: "true"
          VALIDATE_JSON: "true"
          FILTER_REGEX_INCLUDE: ".*tests/fixtures/invalid-json/.*"
          LOG_LEVEL: WARN
          SUPPRESS_POSSUM: "true"
          IGNORE_GITIGNORED_FILES: "false"
          MULTI_STATUS: "false"

      - name: Assert linter reported failure for invalid JSON
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected super-linter to fail on invalid JSON, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: super-linter correctly failed on invalid JSON"
