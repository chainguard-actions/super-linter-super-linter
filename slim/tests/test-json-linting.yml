---
name: Test super-linter JSON linting
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create valid JSON files to lint
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-json-src"
          cat > "$GITHUB_WORKSPACE/test-json-src/config.json" << 'EOF'
          {
            "name": "test",
            "version": "1.0.0",
            "description": "A test JSON file"
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          RUN_LOCAL: "true"
          DEFAULT_WORKSPACE: /github/workspace/test-json-src
          VALIDATE_JSON: "true"
          VALIDATE_ALL_CODEBASE: "true"
          LOG_LEVEL: "NOTICE"
          IGNORE_GITIGNORED_FILES: "true"

      - name: Assert super-linter ran for JSON validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: super-linter JSON validation completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: super-linter ran and reported JSON linting results (failure acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
