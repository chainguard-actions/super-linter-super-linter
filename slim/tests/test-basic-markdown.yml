---
name: Test super-linter basic markdown validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        env:
          RUN_LOCAL: "true"
          VALIDATE_MARKDOWN: "true"
          VALIDATE_ALL_CODEBASE: "true"
          DEFAULT_BRANCH: act-harness
          GITHUB_TOKEN: ${{ github.token }}
          FILTER_REGEX_INCLUDE: ".*tests/fixtures/markdown/.*"

      - name: Assert linter ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: super-linter ran successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: super-linter ran (lint issues found or image pull issue, acceptable under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
