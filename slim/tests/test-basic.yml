---
name: Test super-linter basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a simple valid shell script to lint
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-src"
          cat > "$GITHUB_WORKSPACE/test-src/hello.sh" << 'EOF'
          #!/usr/bin/env bash
          echo "Hello, World!"
          EOF
          chmod +x "$GITHUB_WORKSPACE/test-src/hello.sh"

      - id: action
        uses: .
        continue-on-error: true
        env:
          RUN_LOCAL: "true"
          DEFAULT_WORKSPACE: /github/workspace/test-src
          VALIDATE_BASH: "true"
          VALIDATE_ALL_CODEBASE: "true"
          LOG_LEVEL: "NOTICE"
          IGNORE_GITIGNORED_FILES: "true"

      - name: Assert super-linter ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: super-linter completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: super-linter ran and reported linting results (failure is acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
