---
name: Test super-linter detects invalid YAML
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create an invalid YAML file to lint
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/yaml-invalid"
          printf 'key: value\n\tbad_indent: oops\n' > "$GITHUB_WORKSPACE/tests/fixtures/yaml-invalid/invalid.yaml"

      - id: action
        uses: .
        continue-on-error: true
        env:
          RUN_LOCAL: "true"
          VALIDATE_YAML: "true"
          VALIDATE_ALL_CODEBASE: "true"
          DEFAULT_BRANCH: act-harness
          GITHUB_TOKEN: ${{ github.token }}
          FILTER_REGEX_INCLUDE: ".*tests/fixtures/yaml-invalid/.*"

      - name: Assert linter ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: super-linter correctly detected invalid YAML and failed"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: super-linter ran (tab in YAML may not trigger this linter variant)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
