---
name: Test super-linter run-local mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_LOCAL: "true"
          DEFAULT_WORKSPACE: ${{ github.workspace }}/tests/fixtures/json-lint
          VALIDATE_ALL_CODEBASE: "true"
          VALIDATE_JSON: "true"
          LOG_LEVEL: WARN

      - name: Assert super-linter ran in local mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: super-linter completed successfully in local mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: super-linter ran and reported issues (acceptable outcome in local mode)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
