---
name: Test super-linter JSON validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use RUN_LOCAL to scan filesystem directly without git-based file detection
          RUN_LOCAL: "true"
          # Point to the specific fixture directory to limit scope
          DEFAULT_WORKSPACE: ${{ github.workspace }}/tests/fixtures/json
          # Only enable JSON linting
          VALIDATE_JSON: "true"
          # Disable all other linters
          VALIDATE_ANSIBLE: "false"
          VALIDATE_ARM: "false"
          VALIDATE_BASH: "false"
          VALIDATE_BASH_EXEC: "false"
          VALIDATE_CHECKOV: "false"
          VALIDATE_CLANG_FORMAT: "false"
          VALIDATE_CLOUDFORMATION: "false"
          VALIDATE_COFFEESCRIPT: "false"
          VALIDATE_CPP: "false"
          VALIDATE_CSHARP: "false"
          VALIDATE_CSS: "false"
          VALIDATE_DART: "false"
          VALIDATE_DOCKERFILE_HADOLINT: "false"
          VALIDATE_EDITORCONFIG: "false"
          VALIDATE_ENV: "false"
          VALIDATE_GHERKIN: "false"
          VALIDATE_GITHUB_ACTIONS: "false"
          VALIDATE_GITLEAKS: "false"
          VALIDATE_GO: "false"
          VALIDATE_GO_MODULES: "false"
          VALIDATE_GOOGLE_JAVA_FORMAT: "false"
          VALIDATE_GROOVY: "false"
          VALIDATE_HTML: "false"
          VALIDATE_JAVA: "false"
          VALIDATE_JAVASCRIPT_ES: "false"
          VALIDATE_JAVASCRIPT_PRETTIER: "false"
          VALIDATE_JAVASCRIPT_STANDARD: "false"
          VALIDATE_JSCPD: "false"
          VALIDATE_JSON_PRETTIER: "false"
          VALIDATE_JSX: "false"
          VALIDATE_KOTLIN: "false"
          VALIDATE_KOTLIN_ANDROID: "false"
          VALIDATE_KUBERNETES_KUBECONFORM: "false"
          VALIDATE_LATEX: "false"
          VALIDATE_LUA: "false"
          VALIDATE_MARKDOWN: "false"
          VALIDATE_MARKDOWN_PRETTIER: "false"
          VALIDATE_NATURAL_LANGUAGE: "false"
          VALIDATE_OPENAPI: "false"
          VALIDATE_PERL: "false"
          VALIDATE_PHP_BUILTIN: "false"
          VALIDATE_PHP_PHPCS: "false"
          VALIDATE_PHP_PHPSTAN: "false"
          VALIDATE_PHP_PSALM: "false"
          VALIDATE_POWERSHELL: "false"
          VALIDATE_PROTOBUF: "false"
          VALIDATE_PYTHON_BLACK: "false"
          VALIDATE_PYTHON_FLAKE8: "false"
          VALIDATE_PYTHON_ISORT: "false"
          VALIDATE_PYTHON_MYPY: "false"
          VALIDATE_PYTHON_PYLINT: "false"
          VALIDATE_PYTHON_RUFF: "false"
          VALIDATE_R: "false"
          VALIDATE_RENOVATE: "false"
          VALIDATE_RUBY: "false"
          VALIDATE_RUST_2015: "false"
          VALIDATE_RUST_2018: "false"
          VALIDATE_RUST_2021: "false"
          VALIDATE_RUST_CLIPPY: "false"
          VALIDATE_SCALAFMT: "false"
          VALIDATE_SHELL_SHFMT: "false"
          VALIDATE_SNAKEMAKE_LINT: "false"
          VALIDATE_SNAKEMAKE_SNAKEFMT: "false"
          VALIDATE_SQLFLUFF: "false"
          VALIDATE_TEKTON: "false"
          VALIDATE_TERRAFORM_FMT: "false"
          VALIDATE_TERRAFORM_TERRASCAN: "false"
          VALIDATE_TERRAFORM_TFLINT: "false"
          VALIDATE_TERRAGRUNT: "false"
          VALIDATE_TSX: "false"
          VALIDATE_TYPESCRIPT_ES: "false"
          VALIDATE_TYPESCRIPT_PRETTIER: "false"
          VALIDATE_TYPESCRIPT_STANDARD: "false"
          VALIDATE_XML: "false"
          VALIDATE_YAML: "false"
          VALIDATE_YAML_PRETTIER: "false"

      - name: Assert super-linter JSON validation ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: super-linter JSON validation completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: super-linter ran but reported issues (acceptable in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
