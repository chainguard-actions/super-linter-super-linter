---
name: Test basic usage - lint valid bash file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        name: Run super-linter on valid bash file
        uses: .
        continue-on-error: true
        env:
          RUN_LOCAL: "true"
          VALIDATE_BASH: "true"
          VALIDATE_ALL_CODEBASE: "true"
          LOG_LEVEL: WARN
          FILTER_REGEX_INCLUDE: ".*tests/fixtures/bash/.*"

      - name: Assert linter ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: super-linter ran successfully on valid bash file"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: super-linter ran (may have found issues or sentinel repo issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
